<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1016">
<meta name="description" content="친구와 15분 동안 풀어보는 오리지널 추리 사건.">
<title>퇴근 후 추리실 | 오리지널 추리 게임</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" crossorigin>
<link rel="stylesheet" href="/style.css">
<script type="module" src="/app.js"></script>
</head>
<body>
<header class="mast"><div class="wrap mast-inner">
<a href="/" class="brand"><span class="brand-emoji" aria-hidden="true">🔎</span> 퇴근 후 추리실</a>

</div></header>
<main id="app" class="wrap">
<!-- CASE_HERO -->
<!-- CASE_CATALOG -->
<section id="how" class="how">
<div class="section-title"><h2>수사는 이렇게 진행됩니다</h2><span>플레이 방법</span></div>
<div class="steps">
<article><span class="step-icon">⌕</span><div><p class="eyebrow">01 / 조사</p><h3>단서를 찾아라</h3><p>용의자 진술과 CCTV, 출입 기록을 대조하세요.</p></div></article>
<article><span class="step-icon">▤</span><div><p class="eyebrow">02 / 비교</p><h3>의견을 맞춰라</h3><p>팀으로 플레이한다면 단서를 공유하고, 의견이 갈리는 항목을 비교하세요.</p></div></article>
<article><span class="step-icon">◎</span><div><p class="eyebrow">03 / 지목</p><h3>결론을 내려라</h3><p>핵심 인물과 사건의 전말을 밝히고 결정적 증거를 제출하세요.</p></div></article>
</div>
</section>
</main>
<footer class="wrap"><span>◈ &nbsp; 퇴근 후 추리실</span><span>오리지널 추리 게임</span></footer>
<dialog id="entry"><form id="entry-form">
<div class="section-title"><h2 id="entry-title"></h2><button type="button" id="entry-close" class="ghost" aria-label="닫기">×</button></div>
<p id="entry-case" class="muted" hidden></p>
<label id="code-field">초대 코드<input name="code" maxlength="6" pattern="[A-Za-z0-9]{6}" autocomplete="off" placeholder="6자리 코드"></label>
<label>닉네임<input name="name" required maxlength="16" autocomplete="nickname" placeholder="수사에 사용할 이름"></label>
<p class="error" id="entry-error" role="alert"></p><button class="primary" type="submit">입장하기 →</button>
</form></dialog>
<dialog id="evidence-inspector" aria-labelledby="inspect-title"></dialog>
<p class="toast" id="notice" role="status" hidden></p>
</body>
</html>
